name: Auto Post Telugu Song Lyrics

on:
  schedule:
    - cron: '30 3,12 * * *' # Runs twice daily: 9:00 AM IST & 5:30 PM IST
  workflow_dispatch:        # Allows you to click "Run workflow" manually anytime

permissions:
  contents: write

jobs:
  post_lyrics:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install libraries
        run: pip install google-genai google-api-python-client google-auth-oauthlib pydantic beautifulsoup4 requests feedparser

      - name: Run Lyrics Bot
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
          BLOGGER_TOKEN_JSON: ${{ secrets.BLOGGER_TOKEN_JSON }}
        run: python blogger_lyrics_bot.py

      - name: Commit and push updated posted_links.txt
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add posted_links.txt
          git diff --staged --quiet || git commit -m "Update posted links log"
          git push