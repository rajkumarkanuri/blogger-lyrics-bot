name: Daily Telugu Lyrics Blogger Bot

on:
  schedule:
    - cron: "30 3 * * *"   # 9:00 AM IST
    - cron: "30 12 * * *"  # 6:00 PM IST
  workflow_dispatch:       # Allows manual "Run workflow" button in GitHub

permissions:
  contents: write          # Needed to push updated posted_songs.txt back to repo

jobs:
  publish-lyrics:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install requests feedparser beautifulsoup4 google-genai pydantic google-auth google-api-python-client

      - name: Run lyrics bot (single batch)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BLOGGER_TOKEN_JSON: ${{ secrets.BLOGGER_TOKEN_JSON }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python blogger_lyrics_bot.py

      - name: Commit updated posted_songs.txt
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add posted_songs.txt
          git diff --staged --quiet || git commit -m "chore: update posted_songs.txt"
          git push
